[workspace]
resolver = "3"
members = [
    "crates/wf-types",
    "crates/wf-domain",
    "crates/wf-ports",
    "crates/wf-application",
    "crates/wf-storage",
    "crates/wf-consensus",
    "crates/wf-projection",
    "crates/wf-wire",
    "crates/wf-api-http",
    "crates/wf-api-tcp",
    "crates/wf-worker",
    "crates/wf-node",
    "crates/wf-architecture-tests",
    "crates/wf-test-support",
    "crates/wf-parity-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/ferricstore/ferricstore2"

[workspace.dependencies]
wf-types = { path = "crates/wf-types" }
wf-domain = { path = "crates/wf-domain" }
wf-ports = { path = "crates/wf-ports" }
wf-application = { path = "crates/wf-application" }
wf-storage = { path = "crates/wf-storage" }
wf-consensus = { path = "crates/wf-consensus" }
wf-projection = { path = "crates/wf-projection" }
wf-wire = { path = "crates/wf-wire" }
wf-api-http = { path = "crates/wf-api-http" }
wf-api-tcp = { path = "crates/wf-api-tcp" }
wf-worker = { path = "crates/wf-worker" }
wf-node = { path = "crates/wf-node" }
wf-architecture-tests = { path = "crates/wf-architecture-tests" }
wf-test-support = { path = "crates/wf-test-support" }
wf-parity-tests = { path = "crates/wf-parity-tests" }
sha2 = { version = "=0.11.0", default-features = false }
# ADR-014 step 13: cron schedules resolve wall-clock times in IANA zones from
# the system zoneinfo, as Elixir does with its bundled database.
jiff = { version = "=0.2.28", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# ADR-015: group log block checksums (SHA-256 was 2% of busy CPU).
crc32fast = { version = "=1.5.5", default-features = false, features = ["std"] }
# ADR-015: the shard's hash maps (randomly seeded; SipHash was 7% of busy
# CPU in the 21 Nov profile).
foldhash = { version = "=0.2.0", default-features = false, features = ["std"] }
# ADR-015: the node binary's global allocator (the system allocator was 35%
# of busy CPU in the 21 Nov profile).
mimalloc = { version = "=0.1.52", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["io-util", "net", "rt-multi-thread", "sync"] }
redb = { version = "=4.4.0", git = "https://github.com/cberner/redb", rev = "7061f7e60d4573311c0636e161d417b93e9fd2b1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
excessive_nesting = "deny"
cognitive_complexity = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"
# ADR-010: panic and silent-drop restrictions with no workspace exceptions.
unreachable = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
exit = "deny"
fallible_impl_from = "deny"

[workspace.metadata.ferricstore]
stage = "m0-infrastructure"
supported-feature-profiles = ["default"]

[profile.dev]
# Line tables keep panic and backtrace locations while cutting link time and
# target size; dependencies carry no debug info (ADR-012).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
overflow-checks = true
